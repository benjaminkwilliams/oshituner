name: Release Windows installer

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'
      - name: Verify official version tag
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/oshituner/Version.props -Raw)).Project.PropertyGroup.OshiOfficialVersion
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw "Expected tag v$version." }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tags must point to a commit on the official main branch.' }
      - name: Build self-contained installer
        shell: pwsh
        env:
          OSHI_TWITCH_CLIENT_ID: ${{ vars.OSHI_TWITCH_CLIENT_ID }}
        run: |
          if (-not $env:OSHI_TWITCH_CLIENT_ID) { throw 'Configure the public OSHI_TWITCH_CLIENT_ID repository variable before releasing.' }
          ./scripts/Build-WindowsInstaller.ps1 -OutputDirectory "${env:RUNNER_TEMP}/oshi-release"
      - name: Smoke-test installation, updates, and uninstallation
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $setup = "$env:RUNNER_TEMP/oshi-release/Oshi-Tuner-$version-win-x64-Setup.exe"
          $install = Join-Path $env:RUNNER_TEMP 'oshi-install-smoke'
          $quiet = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
          $result = Start-Process -FilePath $setup -ArgumentList ($quiet + @('/SP-', "/DIR=`"$install`"")) -WindowStyle Hidden -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer exit code $($result.ExitCode)." }

          $app = Join-Path $install 'oshituner.exe'
          $runtime = Get-Content (Join-Path $install 'oshituner.runtimeconfig.json') -Raw | ConvertFrom-Json
          $frameworks = $runtime.runtimeOptions.includedFrameworks.name
          foreach ($expected in @('Microsoft.NETCore.App','Microsoft.WindowsDesktop.App','Microsoft.AspNetCore.App')) {
            if ($expected -notin $frameworks) { throw "Missing runtime $expected." }
          }
          if ([Reflection.AssemblyName]::GetAssemblyName((Join-Path $install 'oshituner.dll')).Version.ToString() -ne $version) {
            throw 'Installed app version does not match the release tag.'
          }
          if (-not (Test-Path (Join-Path $install 'LICENSE.txt')) -or
              -not (Test-Path (Join-Path $install 'ThirdParty/ModelContextProtocol-LICENSE.txt'))) {
            throw 'Installed license files are missing.'
          }
          $profileKey = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData(
            [Text.Encoding]::UTF8.GetBytes($install.ToUpperInvariant()))).ToLowerInvariant()
          $log = Join-Path $env:LOCALAPPDATA "oshituner/installs/$profileKey/oshi.jsonl"
          function Read-DesktopStarts {
            if (!(Test-Path -LiteralPath $log)) { return }
            Get-Content -LiteralPath $log | ForEach-Object { $_ | ConvertFrom-Json } |
              Where-Object { $_.category -eq 'Startup' -and $_.message -match '^Installer update,' }
          }

          foreach ($watch in 0, 1) {
            $mode = if ($watch) { 'tray' } else { 'windowed' }
            $running = if ($watch) { 'True' } else { 'False' }
            $before = @(Read-DesktopStarts).Count
            $previous = Start-Process -FilePath $app -ArgumentList "--after-update ${watch}${watch}00" -PassThru
            try {
              $deadline = [DateTime]::UtcNow.AddSeconds(20)
              while (@(Read-DesktopStarts).Count -le $before -and [DateTime]::UtcNow -lt $deadline -and !$previous.HasExited) {
                Start-Sleep -Milliseconds 200
              }
              if ($previous.HasExited -or @(Read-DesktopStarts).Count -ne ($before + 1)) {
                throw 'The desktop did not start before the update.'
              }

              $update = Start-Process -FilePath $setup -ArgumentList ($quiet + @('/SP-', '/OSHIUPDATE=1',
                "/DIR=`"$install`"", "/OSHIWATCH=$watch", "/OSHITRAY=$watch")) -WindowStyle Hidden -PassThru
              if (!$update.WaitForExit(120000) -or $update.ExitCode -ne 0) { throw 'The update installer did not finish successfully.' }
              if (!$previous.WaitForExit(6000)) { throw 'The update installer did not close the previous desktop.' }

              $deadline = [DateTime]::UtcNow.AddSeconds(20)
              while (@(Read-DesktopStarts).Count -le ($before + 1) -and [DateTime]::UtcNow -lt $deadline) {
                Start-Sleep -Milliseconds 200
              }
              $starts = @(Read-DesktopStarts)
              if ($starts.Count -ne ($before + 2) -or $starts[-1].message -notlike "Installer update, $mode. Oshi Watch: $running;*") {
                throw "The updated desktop did not restore Oshi Watch=$running in $mode mode."
              }
            } finally {
              $exitRequest = Start-Process -FilePath $app -ArgumentList '--exit' -WindowStyle Hidden -Wait -PassThru
              if (!$previous.HasExited) { Stop-Process -InputObject $previous }
              if ($exitRequest.ExitCode -ne 0) { throw 'The installed desktop app did not exit cleanly.' }
            }
          }

          $uninstall = @(Get-ChildItem -LiteralPath $install -Filter 'unins*.exe')
          if ($uninstall.Count -ne 1) { throw 'Expected one uninstaller.' }
          $result = Start-Process -FilePath $uninstall[0].FullName -ArgumentList $quiet -WindowStyle Hidden -Wait -PassThru
          if ($result.ExitCode -ne 0 -or (Test-Path -LiteralPath $app)) { throw 'Uninstallation did not remove the app.' }
      - name: Attest the tested installer
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: ${{ runner.temp }}/oshi-release/*-Setup.exe
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-installer
          path: ${{ runner.temp }}/oshi-release/*-Setup.exe
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-installer
          path: installer
      - name: Publish release and installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="Oshi-Tuner-${GITHUB_REF_NAME#v}-win-x64-Setup.exe"
          test -f "installer/$asset"
          verify_installer() {
            gh attestation verify "$1" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          }
          verify_installer "installer/$asset"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir published
            verify_installer "published/$asset"
          else
            gh release create "$GITHUB_REF_NAME" "installer/$asset" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "Oshi Tuner ${GITHUB_REF_NAME#v}" \
              --notes "Self-contained Windows x64 installer. Installs for the current Windows user."
          fi
